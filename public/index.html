<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GPS Scooter Tracker</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>
    <h1>GPS Scooter Tracker</h1>
    <form action="/logout" method="GET">
    <button type="submit" id="logoutButton">
        Logout
    </button>
</form>
</header>

<div class="container">

    <div class="info-panel">

        <div class="card">
            <div class="label">Statut</div>
            <div id="status" class="value">Connexion...</div>
        </div>
    <div class="card trip-card">

        <div class="label">
            Trajet actuel
        </div>

        <div id="currentTrip" class="value">
            Chargement...
        </div>

        <div id="currentTripStarted" class="trip-started">
            --
        </div>

        <button
            type="button"
            id="newTripButton"
            class="new-trip-button"
        >
            + Nouveau trajet
        </button>

    </div>
        <div class="card">
            <div class="label">Latitude</div>
            <div id="latitude" class="value">--</div>
        </div>

        <div class="card">
            <div class="label">Longitude</div>
            <div id="longitude" class="value">--</div>
        </div>

        <div class="card">
            <div class="label">Vitesse</div>
            <div id="speed" class="value">-- km/h</div>
        </div>

    </div>

    <div class="card">
        <div class="label">Position du scooter</div>
        <div id="map"></div>
    </div>

    <div class="card">
        <div class="label">Dernière mise à jour</div>
        <div id="lastUpdate" class="value">--</div>
    </div>

</div>

<!-- Leaflet JS -->
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script src="/js/dashboard.js"></script>

</body>
</html>
