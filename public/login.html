<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - GPS Scooter</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <div class="login-box">

        <h1>GPS Scooter</h1>

        <div id="errorMessage" class="error-message" style="display:none;">
            Identifiants incorrects
        </div>

        <form method="POST" action="/login">

            <label for="username">
                Nom d'utilisateur
            </label>

            <input
                type="text"
                id="username"
                name="username"
                required
            >

            <label for="password">
                Mot de passe
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <button type="submit">
                Se connecter
            </button>

        </form>

    </div>

    <script src="/js/login.js"></script>
</body>
</html>
